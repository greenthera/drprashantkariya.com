<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Page Not Found | Dr. Prashant Kariya</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License — https://github.com/rafgraph/spa-github-pages
    // GitHub Pages has no server-side rewrites, so a direct visit or
    // refresh on a deep link (e.g. /courses) 404s. This encodes the
    // intended path into a query string and redirects to the real
    // index.html, which index.html's own inline script then decodes
    // back into a normal URL via history.replaceState before React
    // mounts, so react-router sees the correct route.
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body>
  <noscript><h1>Page not found</h1><p><a href="/">Return to home</a></p></noscript>
</body>

</html>
